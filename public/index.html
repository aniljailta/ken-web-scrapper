<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Query</title>
    <style>
      /* General styles */
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
      }

      /* Card container */
      .card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 1100px;
        width: 90%; /* Ensures the card fits smaller screens */
        padding: 20px;
        box-sizing: border-box;
        margin: 10px;
      }

      /* Title */
      h1 {
        font-size: 24px;
        margin-bottom: 20px;
        text-align: center;
      }

      /* Form groups */

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }

      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }

      /* Submit button */
      button {
        width: 110px;
        background-color: #007bff;
        color: white;
        padding: 10px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background-color: #0056b3;
      }

      /* Response box */
      .response {
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #f9f9f9;
        max-height: 300px; /* Limit height */
        overflow-y: auto; /* Make scrollable when content exceeds height */
      }

      /* Spinner */
      .spinner {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 20px;
      }

      .spinner div {
        width: 20px;
        height: 20px;
        margin: 5px;
        background-color: #007bff;
        border-radius: 50%;
        animation: bounce 1.5s infinite ease-in-out;
      }

      .spinner div:nth-child(2) {
        animation-delay: -1s;
      }

      .product {
        margin-bottom: 20px;
      }

      .mb-5 {
        margin-bottom: 20px;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }

      /* Responsive styles for smaller devices */
      @media (max-width: 600px) {
        h1 {
          font-size: 20px;
        }

        button {
          font-size: 14px;
          padding: 8px;
        }

        input {
          padding: 8px;
        }

        .card {
          padding: 15px;
        }

        .response {
          max-height: 200px; /* Reduce height for smaller screens */
        }
      }
      .flex {
        display: flex;
        justify-content: space-between; /* Space elements evenly */
        align-items: center; /* Center elements vertically */
        gap: 10px; /* Optional gap between elements */
        flex-wrap: wrap;
      }

      /* Each form group takes equal width */
      .form-group {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 20px;
      }

      /* Input fields should stretch to fill the width of their parent */
      .form-group input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        height: 40px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Cisco Product Query</h1>
      <div class="flex">
        <div class="form-group">
          <label for="inputBox">Enter product name or Id</label>
          <input type="text" id="inputBox" placeholder="Enter text" />
        </div>
        <div class="form-group">
          <label for="passwordBox">Enter Password</label>
          <input
            type="password"
            id="passwordBox"
            placeholder="Enter your password"
          />
        </div>

        <button onclick="callApi()">Submit</button>
      </div>
      <div class="spinner" id="spinner" style="display: none">
        <div></div>
        <div></div>
      </div>
      <div class="response" id="responseDiv" style="display: none">
        Response will appear here...
      </div>
    </div>

    <script>
      function generateHTML(data) {
        return data
          .map((product) => {
            // Map the Supported Models
            const supportedModels = product?.additionalInfo?.Supported_Models
              ?.length
              ? product.additionalInfo.Supported_Models.map(
                  (model) => `<li>${model}</li>`,
                ).join('')
              : [];

            const productIds = product?.productIds?.length
              ? product.productIds.map((model) => `<li>${model}</li>`).join('')
              : [];

            // Map the Internal Links
            const internalLinks =
              product.internalLinks?.length > 0
                ? product.internalLinks
                    .map((link) => {
                      // Helper function to render fields dynamically
                      const renderField = (field) => {
                        if (!field) return '';

                        const text = field.text ? `<p>${field.text}</p>` : '';
                        const tables =
                          field.tables?.length > 0
                            ? field.tables
                                .map(
                                  (table) =>
                                    `<div class="table mb-5">${table}</div>`,
                                )
                                .join('')
                            : '';

                        return `${text}${tables}`;
                      };

                      // Render all fields in the `link` object dynamically
                      const dynamicFields = Object.keys(link)
                        .filter(
                          (key) =>
                            !['name', 'link', 'id', 'productDataId'].includes(
                              key,
                            ),
                        ) // Exclude `name` and `link`
                        .map((key) => {
                          const field = link[key];

                          // Skip rendering if field data is null, undefined, or empty
                          if (
                            !field ||
                            (typeof field === 'object' &&
                              !field.text &&
                              !field.tables?.length)
                          ) {
                            return '';
                          }

                          // Render the field title and content

                          const formattedTitle = key
                            .replace(/_/g, ' ') // Replace underscores with spaces
                            .replace(/\b\w/g, (char) => char.toUpperCase()); // Capitalize each word
                          const fieldTitle = `<h5>${formattedTitle}</h5>`;
                          return `${fieldTitle}${renderField(field)}`;
                        })
                        .filter(Boolean) // Remove any empty strings from the map
                        .join('');

                      // Handle name and link separately
                      const textContent = `
            <div>
              <h4>${link.name}</h4>
              ${link.link ? `<p>Link: <a href="${link.link}" target="_blank">${link.link}</a></p>` : ''}
              ${dynamicFields}
            </div>
          `;

                      return textContent;
                    })
                    .join('')
                : '';

            return `
                <div class="product">
                    <h2>${product.productName}</h2>
                    <p>Link: <a href="${product.link}" target="_blank">${product.link}</a></p>
                    <p>Status: ${product.additionalInfo?.Status || 'N/A'}</p>
                    <p>End-of-Sale Date: ${product.additionalInfo['End-of-Sale_Date'] || 'N/A'}</p>
                    <p>End-of-Support Date: ${product.additionalInfo['End-of-Support_Date'] || 'N/A'}</p>
                    <p>Series Release Date: ${product.additionalInfo.Series_Release_Date || 'N/A'}</p>
                    <p>Migration Info: ${product.additionalInfo?.migrationOfProducts || 'N/A'}</p>
                ${
                  supportedModels.length > 0
                    ? `<h3>Supported Models</h3>
                    <ul>${supportedModels || '<li>N/A</li>'}</ul>`
                    : ''
                }

${
  productIds.length > 0
    ? `<h3>Product PIDs</h3>
                    <ul>${productIds || '<li>N/A</li>'}</ul>`
    : ''
}
                ${
                  internalLinks.length > 0
                    ? ` <h3>Internal Links</h3>
                    ${internalLinks || '<p>No links available</p>'}`
                    : ''
                }
                </div>
            `;
          })
          .join('');
      }

      async function callApi() {
        const input = document.getElementById('inputBox').value;
        const password = document.getElementById('passwordBox').value;
        const responseDiv = document.getElementById('responseDiv');
        const spinner = document.getElementById('spinner');
        const button = document.querySelector('button');
        const passwordHex = password
          .split('')
          .map((char) => char.charCodeAt(0).toString(16))
          .join('');
        if (!input || !password) {
          alert('Error: Both fields are required.');
          return;
        }

        button.disabled = true;
        button.style.cursor = 'not-allowed';
        // Show loading spinner and hide response box
        spinner.style.display = 'flex';
        responseDiv.style.display = 'none';

        try {
          const response = await fetch('/api/products/product-query', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ question: input, password: passwordHex }),
          });

          const data = await response.json();

          // Hide spinner and show response
          spinner.style.display = 'none';
          responseDiv.style.display = 'block';
          // Format response for better readability
          // responseDiv.innerText = data.response;

          const htmlContent = generateHTML(data.response);
          document.getElementById('responseDiv').innerHTML = htmlContent;
        } catch (error) {
          console.error({ error });
          spinner.style.display = 'none';
          responseDiv.style.display = 'block';
          responseDiv.innerText = 'Error: Unable to connect to API';
        } finally {
          // Re-enable the button
          button.disabled = false;
          button.style.cursor = 'pointer';
        }
      }
    </script>
  </body>
</html>
