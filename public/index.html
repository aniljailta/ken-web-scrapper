<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Great Migration</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="bg-white rounded-lg shadow-lg max-w-4xl w-11/12 p-6 mx-4">
      <h1 class="text-2xl font-bold text-center mb-6">Cisco Product Query</h1>
      <div class="flex flex-col md:flex-row gap-4 mb-6">
        <div class="flex-1">
          <label for="inputBox" class="block font-bold mb-2"
            >Enter Cisco PID or Product</label
          >
          <input
            type="text"
            id="inputBox"
            placeholder="Enter text"
            class="w-full p-2 border border-gray-300 rounded-md"
          />
        </div>
        <div class="flex-1">
          <label for="passwordBox" class="block font-bold mb-2"
            >Enter Password</label
          >
          <input
            type="password"
            id="passwordBox"
            placeholder="Enter your password"
            class="w-full p-2 border border-gray-300 rounded-md"
          />
        </div>
        <button
          onclick="callApi()"
          class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition-colors self-end"
        >
          Submit
        </button>
      </div>
      <div id="spinner" class="hidden justify-center items-center mt-6">
        <div class="animate-ping w-4 h-4 bg-blue-500 rounded-full mr-2"></div>
        <div
          class="animate-ping w-4 h-4 bg-blue-500 rounded-full"
          style="animation-delay: -1s"
        ></div>
      </div>
      <div
        id="responseDiv"
        class="hidden mt-6 p-4 border border-gray-300 rounded-lg bg-gray-50 max-h-80 overflow-y-auto"
      >
        Response will appear here...
      </div>
    </div>

    <script>
      function generateHTML(data) {
        return data
          .map((product) => {
            // Map the Supported Models
            const supportedModels = product?.additionalInfo?.Supported_Models
              ?.length
              ? product.additionalInfo.Supported_Models.map(
                  (model) => `<li>${model}</li>`,
                ).join('')
              : [];

            const productIds = product?.productIds?.length
              ? product.productIds.map((model) => `<li>${model}</li>`).join('')
              : [];

            // Map the Internal Links
            const internalLinks =
              product.internalLinks?.length > 0
                ? product.internalLinks

                    .map((link) => {
                      // Helper function to render fields dynamically
                      const renderField = (field) => {
                        if (!field) return '';

                        const text = field.text ? `<p>${field.text}</p>` : '';
                        const tables =
                          field.tables?.length > 0
                            ? field.tables
                                .map(
                                  (table) =>
                                    `<div class="table mb-5">${table}</div>`,
                                )
                                .join('')
                            : '';

                        return `${text}${tables}`;
                      };

                      // Render all fields in the `link` object dynamically
                      const dynamicFields = Object.keys(link)
                        .filter(
                          (key) =>
                            !['name', 'link', 'id', 'productDataId'].includes(
                              key,
                            ),
                        ) // Exclude `name` and `link`
                        .map((key) => {
                          const field = link[key];

                          // Skip rendering if field data is null, undefined, or empty
                          if (
                            !field ||
                            (typeof field === 'object' &&
                              !field.text &&
                              !field.tables?.length)
                          ) {
                            return '';
                          }

                          // Render the field title and content

                          const formattedTitle = key
                            .replace(/_/g, ' ') // Replace underscores with spaces
                            .replace(/\b\w/g, (char) => char.toUpperCase()); // Capitalize each word
                          const fieldTitle = `<h5 class="font-bold mt-4">${formattedTitle}</h5>`;
                          return `${fieldTitle}${renderField(field)}`;
                        })
                        .filter(Boolean) // Remove any empty strings from the map
                        .join('');

                      // Handle name and link separately
                      const textContent = `
                        <div class="mb-6">
                          <h4 class="font-bold text-lg">${link.name}</h4>
                          ${link.link ? `<p class="mt-2">Link: <a href="${link.link}" target="_blank" class="text-blue-500 hover:underline">${link.link}</a></p>` : ''}
                          ${dynamicFields}
                        </div>
                      `;

                      return textContent;
                    })
                    .join('')
                : '';

            return `
                <div class="product mb-8">
                    <h2 class="text-xl font-bold">${product.productName}</h2>
                    <p class="mt-2">Link: <a href="${product.link}" target="_blank" class="text-blue-500 hover:underline">${product.link}</a></p>
                    <p class="mt-2">Status: ${product.additionalInfo?.Status || 'N/A'}</p>
                    ${product.additionalInfo['End-of-Sale_Date'] ? `<p class="mt-2">End-of-Sale Date: ${product.additionalInfo['End-of-Sale_Date'] || 'N/A'}</p>` : ''}
                    ${product.additionalInfo['End-of-Support_Date'] ? `<p class="mt-2">End-of-Support Date: ${product.additionalInfo['End-of-Support_Date'] || 'N/A'}</p>` : ''}
                    ${product.additionalInfo.Series_Release_Date ? `<p class="mt-2">Series Release Date: ${product.additionalInfo.Series_Release_Date || 'N/A'}</p>` : ''}
                  ${product.additionalInfo?.migrationOfProducts ? `<p class="mt-2">Migration Info: ${product.additionalInfo?.migrationOfProducts || 'N/A'}</p>` : ''}
                   
                ${
                  supportedModels.length > 0
                    ? `<h3 class="font-bold mt-4">Supported Models</h3>
                    <ul class="list-disc pl-6 mt-2">${supportedModels || '<li>N/A</li>'}</ul>`
                    : ''
                }

                ${
                  productIds.length > 0
                    ? `<h3 class="font-bold mt-4">Product PIDs</h3>
                                    <ul class="list-disc pl-6 mt-2">${productIds || '<li>N/A</li>'}</ul>`
                    : ''
                }
                ${
                  internalLinks.length > 0
                    ? ` <h3 class="font-bold mt-4">Data Links</h3>
                    ${internalLinks || '<p>No links available</p>'}`
                    : ''
                }
                </div>
            `;
          })
          .join('');
      }

      async function callApi() {
        const input = document.getElementById('inputBox').value;
        const password = document.getElementById('passwordBox').value;
        const responseDiv = document.getElementById('responseDiv');
        const spinner = document.getElementById('spinner');
        const button = document.querySelector('button');
        const passwordHex = password
          .split('')
          .map((char) => char.charCodeAt(0).toString(16))
          .join('');
        if (!input || !password) {
          alert('Error: Both fields are required.');
          return;
        }

        button.disabled = true;
        button.classList.add('cursor-not-allowed');
        // Show loading spinner and hide response box
        spinner.classList.remove('hidden');
        spinner.classList.add('flex');
        responseDiv.classList.add('hidden');

        try {
          const response = await fetch('/api/products/product-query', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ question: input, password: passwordHex }),
          });

          const responseData = await response.json();

          // Hide spinner and show response
          spinner.classList.add('hidden');
          responseDiv.classList.remove('hidden');
          // Format response for better readability

          if (responseData.isAIResponse) {
            responseDiv.innerText = responseData.data;
          } else {
            if (!responseData.data?.length) {
              responseDiv.innerText = 'No Relevant Product Found!';
            } else {
              const htmlContent = generateHTML(responseData.productData);
              document.getElementById('responseDiv').innerHTML = htmlContent;
            }
          }
        } catch (error) {
          console.error({ error });
          spinner.classList.add('hidden');
          responseDiv.classList.remove('hidden');
          responseDiv.innerText = 'No Relevant Product Found!';
        } finally {
          // Re-enable the button
          button.disabled = false;
          button.classList.remove('cursor-not-allowed');
        }
      }
    </script>
  </body>
</html>
