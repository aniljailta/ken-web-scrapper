<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Query</title>
    <style>
      /* General styles */
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
      }

      /* Card container */
      .card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 800px;
        width: 90%; /* Ensures the card fits smaller screens */
        padding: 20px;
        box-sizing: border-box;
        margin: 10px;
      }

      /* Title */
      h1 {
        font-size: 24px;
        margin-bottom: 20px;
        text-align: center;
      }

      /* Form groups */
      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }

      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }

      /* Submit button */
      button {
        width: 100%;
        background-color: #007bff;
        color: white;
        padding: 10px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background-color: #0056b3;
      }

      /* Response box */
      .response {
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #f9f9f9;
        white-space: pre-wrap; /* Preserve formatting for multiline responses */
        max-height: 300px; /* Limit height */
        overflow-y: auto; /* Make scrollable when content exceeds height */
      }

      /* Spinner */
      .spinner {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 20px;
      }

      .spinner div {
        width: 20px;
        height: 20px;
        margin: 5px;
        background-color: #007bff;
        border-radius: 50%;
        animation: bounce 1.5s infinite ease-in-out;
      }

      .spinner div:nth-child(2) {
        animation-delay: -1s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }

      /* Responsive styles for smaller devices */
      @media (max-width: 600px) {
        h1 {
          font-size: 20px;
        }

        button {
          font-size: 14px;
          padding: 8px;
        }

        input {
          padding: 8px;
        }

        .card {
          padding: 15px;
        }

        .response {
          max-height: 200px; /* Reduce height for smaller screens */
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Cisco Product Query</h1>
      <div class="form-group">
        <label for="inputBox">Enter product name or Id</label>
        <input type="text" id="inputBox" placeholder="Enter text" />
      </div>
      <div class="form-group">
        <label for="passwordBox">Enter Password</label>
        <input
          type="password"
          id="passwordBox"
          placeholder="Enter your password"
        />
      </div>
      <button onclick="callApi()">Submit</button>
      <div class="spinner" id="spinner" style="display: none">
        <div></div>
        <div></div>
      </div>
      <div class="response" id="responseDiv" style="display: none">
        Response will appear here...
      </div>
    </div>

    <script>
      async function callApi() {
        const input = document.getElementById('inputBox').value;
        const password = document.getElementById('passwordBox').value;
        const responseDiv = document.getElementById('responseDiv');
        const spinner = document.getElementById('spinner');
        const button = document.querySelector('button');
        const passwordHex = password
          .split('')
          .map((char) => char.charCodeAt(0).toString(16))
          .join('');
        if (!input || !password) {
          alert('Error: Both fields are required.');
          return;
        }

        button.disabled = true;
        button.style.cursor = 'not-allowed';
        // Show loading spinner and hide response box
        spinner.style.display = 'flex';
        responseDiv.style.display = 'none';

        try {
          const response = await fetch('/scraper/product-query', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ question: input, password: passwordHex }),
          });

          const data = await response.json();

          // Hide spinner and show response
          spinner.style.display = 'none';
          responseDiv.style.display = 'block';

          // Format response for better readability
          responseDiv.innerText = data.response
            .replace(/;/g, '\n')
            .replace(/,/g, ', ');
        } catch (error) {
          spinner.style.display = 'none';
          responseDiv.style.display = 'block';
          responseDiv.innerText = 'Error: Unable to connect to API';
        } finally {
          // Re-enable the button
          button.disabled = false;
          button.style.cursor = 'pointer';
        }
      }
    </script>
  </body>
</html>
