<!-- public/login.html -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Great Migration</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div
      id="loginCard"
      class="w-full max-w-md p-6 bg-white rounded-lg shadow-md"
    >
      <h1 class="mb-4 text-2xl font-bold text-center">Login</h1>
      <form id="loginForm" class="space-y-4">
        <div class="flex flex-col space-y-2">
          <label for="email" class="text-sm font-medium">Email</label>
          <input
            type="text"
            id="email"
            name="email"
            required
            class="w-full p-2 border border-gray-300 rounded-md focus:ring focus:ring-blue-300"
          />
        </div>
        <div class="flex flex-col space-y-2">
          <label for="password" class="text-sm font-medium">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            class="w-full p-2 border border-gray-300 rounded-md focus:ring focus:ring-blue-300"
          />
        </div>
        <button
          type="submit"
          class="w-full p-2 text-white bg-blue-500 rounded-md hover:bg-blue-600"
        >
          Login
        </button>
      </form>
    </div>

    <div
      id="adminSection"
      class="hidden w-full max-w-3xl mt-6 p-6 bg-white rounded-lg shadow-md"
    >
      <h2 class="mb-2 text-xl font-semibold">Prompt Section</h2>
      <textarea
        id="promptTextArea"
        rows="20"
        class="w-full p-2 border border-gray-300 rounded-md"
      ></textarea>
      <input type="hidden" id="token" />
      <button
        id="submitPrompt"
        class="w-full mt-4 p-2 text-white bg-green-500 rounded-md hover:bg-green-600"
      >
        Submit
      </button>
    </div>

    <div
      id="loading"
      class="fixed inset-0 flex items-center justify-center hidden bg-gray-900 bg-opacity-50"
    >
      <div class="p-4 text-white bg-blue-500 rounded-lg">Loading...</div>
    </div>

    <script>
      document
        .getElementById('loginForm')
        .addEventListener('submit', async (e) => {
          e.preventDefault();
          document.getElementById('loading').classList.remove('hidden');

          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;

          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();
          if (data.access_token) {
            document.getElementById('token').value = data.access_token;
            localStorage.setItem('token', data.access_token);

            const userResponse = await fetch('/api/users/user-values-by-name', {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${data.access_token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ name: 'ai_prompt' }),
            });

            const promptValues = await userResponse.json();

            if (promptValues) {
              document.getElementById('loginCard').classList.add('hidden');
              document
                .getElementById('adminSection')
                .classList.remove('hidden');
              document.getElementById('promptTextArea').value =
                promptValues.text;
            }
          } else {
            alert('Invalid credentials');
          }

          document.getElementById('loading').classList.add('hidden');
        });

      document
        .getElementById('submitPrompt')
        .addEventListener('click', async () => {
          const token = document.getElementById('token').value;
          const text = document.getElementById('promptTextArea').value;

          const response = await fetch('/api/users/update-user-value', {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${token}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ name: 'ai_prompt', text }),
          });

          const result = await response.json();
          alert(result.message || 'Updated successfully!');
        });
    </script>
  </body>
</html>
