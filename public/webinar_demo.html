<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webinar ChatBot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown.min.css"
      integrity="sha512-BrOPA520KmDMqieeM7XFe6a3u3Sb3F1JBaQnrIAmWg3EYrciJ+Qqe6ZcKCdfPv26rGcgTrJnZ/IdQEct8h3Zhw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <style>
    #chatbot-widget {
      width: 420px;
      height: 600px;
      border-radius: 24px;
      border: 1px solid #ddd;
      display: none;
      flex-direction: column;
    }

    #chatbot-widget.active {
      display: flex;
    }

    #chatbot-widget .header {
      border-radius: 24px 24px 0px 0px;
      border-bottom: none;
      background: #e31937;
      color: #fff;
      padding-inline: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }

    #chatbot-widget .header p {
      color: #fff;
      font-family: Roboto;
      font-size: 18px;
      font-style: normal;
      font-weight: 600;
      margin: 0;
      line-height: normal;
      text-align: left;
    }

    #chatbot-widget .main-content {
      display: flex;
      flex: 1;
      padding: 16px;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      gap: 16px;
      overflow: auto;
    }

    #chatbot-widget .main-content .message {
      color: #000;
      font-family: Roboto;
      font-size: 16px;
      font-style: normal;
      text-align: left;
      font-weight: 400;
      line-height: 1.8;
      align-self: flex-start;
      padding: 12px 16px;
      border-radius: 16px;
      background: #f7f7f7;
      max-width: 358px;
    }

    #chatbot-widget .main-content .message.user {
      font-weight: 400;
      text-align: left;
      align-self: flex-end;
      color: #222;
      background: #ededed;
    }

    #chatbot-widget .main-content .message.error {
      font-weight: 400;
      color: #e31937;
      align-self: center;
    }

    #chatbot-widget .header #close-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #chatbot-widget .footer .chat-input {
      border: 1px solid #ddd;
      background: #f9f9f9;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: start;
      gap: 4px;
      padding-inline: 16px;
      height: 48px;
    }

    #chatbot-widget .footer .chat-input input {
      outline: none;
      border: none;
      background-color: inherit;
      color: #000;
      font-family: Roboto;
      font-size: 14px;
      font-style: normal;
      font-weight: 400;
      line-height: normal;
      flex: 1;
      padding: 8px;
    }

    #chatbot-widget .footer .chat-input .send-btn {
      cursor: pointer;
    }

    #chatbot-widget .footer {
      background-color: #fff;
      border-radius: 0 0 24px 24px;
      border-top: 1px solid #dddddd;
      padding-top: 14px;
      padding-inline: 16px;
    }
    #chatbot-widget .footer .footer-content {
      color: rgba(0, 0, 0, 0.6);
      text-align: center;
      font-family: 'Roboto Mono';
      font-size: 10px;
      font-style: normal;
      font-weight: 400;
      line-height: normal;
      margin: 10px;
    }

    #chatbot-widget .footer .footer-content a {
      color: rgba(0, 0, 0, 0.6);
    }

    #chatbot-widget-toggler {
      border-radius: 24px;
      background: #e31937;
      width: 236px;
      height: 48px;
      color: #fff;
      font-family: 'Roboto Mono';
      font-size: 14px;
      font-style: normal;
      font-weight: 400;
      line-height: normal;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    #chatbot-widget-toggler.hidden {
      display: none;
    }

    .fix-bottom {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
    }

    #chatbot-widget .suggestions {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      align-self: center;
      gap: 20px;
      margin-top: auto;
      margin-bottom: auto;
    }

    #chatbot-widget .suggestions .title {
      color: #000;
      font-family: Roboto;
      font-size: 12px;
      font-style: normal;
      font-weight: 600;
      line-height: normal;
    }

    #chatbot-widget .suggestion-list {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 16px;
    }

    #chatbot-widget .suggestion-list.row {
      flex-direction: row;
      overflow: auto;
      padding-bottom: 14px;
      display: none;
    }

    #chatbot-widget .suggestion-list.row.active {
      display: flex;
    }

    #chatbot-widget .suggestion-list .suggestion {
      border-radius: 999px;
      background: #f7f7f7;
      padding: 12px 16px;
      color: rgba(0, 0, 0, 0.8);
      font-family: Roboto;
      font-size: 14px;
      font-style: normal;
      font-weight: 400;
      line-height: normal;
      min-width: fit-content;
      cursor: pointer;
    }

    #chatbot-widget .suggestion-list .suggestion:hover {
      background: #d8d8d8;
    }

    #chatbot-widget .loader {
      height: 30px;
      align-self: flex-start;
      margin-left: 16px;
      min-height: 30px;
      aspect-ratio: 2.5;
      --_g: no-repeat radial-gradient(farthest-side, #000 90%, #0000);
      background: var(--_g), var(--_g), var(--_g), var(--_g);
      background-size: 20% 50%;
      animation: l43 1s infinite linear;
    }
    @keyframes l43 {
      0% {
        background-position:
          calc(0 * 100% / 3) 50%,
          calc(1 * 100% / 3) 50%,
          calc(2 * 100% / 3) 50%,
          calc(3 * 100% / 3) 50%;
      }
      16.67% {
        background-position:
          calc(0 * 100% / 3) 0,
          calc(1 * 100% / 3) 50%,
          calc(2 * 100% / 3) 50%,
          calc(3 * 100% / 3) 50%;
      }
      33.33% {
        background-position:
          calc(0 * 100% / 3) 100%,
          calc(1 * 100% / 3) 0,
          calc(2 * 100% / 3) 50%,
          calc(3 * 100% / 3) 50%;
      }
      50% {
        background-position:
          calc(0 * 100% / 3) 50%,
          calc(1 * 100% / 3) 100%,
          calc(2 * 100% / 3) 0,
          calc(3 * 100% / 3) 50%;
      }
      66.67% {
        background-position:
          calc(0 * 100% / 3) 50%,
          calc(1 * 100% / 3) 50%,
          calc(2 * 100% / 3) 100%,
          calc(3 * 100% / 3) 0;
      }
      83.33% {
        background-position:
          calc(0 * 100% / 3) 50%,
          calc(1 * 100% / 3) 50%,
          calc(2 * 100% / 3) 50%,
          calc(3 * 100% / 3) 100%;
      }
      100% {
        background-position:
          calc(0 * 100% / 3) 50%,
          calc(1 * 100% / 3) 50%,
          calc(2 * 100% / 3) 50%,
          calc(3 * 100% / 3) 50%;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <script>
    // DOM Elements
    const selectors = {
      togglerBtn: '#chatbot-widget-toggler',
      mainContent: '#chatbot-widget .main-content',
      closeBtn: '#chatbot-widget #close-btn',
      chatInput: '#chatbot-widget #input-field',
      sendBtn: '#chatbot-widget .send-btn',
      chatBotWidget: '#chatbot-widget',
      suggestionContainer: '#chatbot-widget .suggestions',
      suggestionElements: '#chatbot-widget .suggestion-list .suggestion',
      bottomSuggestionList: '.suggestion-list.row',
    };

    const SESSION_CLOSING_THRESHOLD = 2 * 60 * 1000;
    const SESSION_TIMER_KEY = 'session_timer_id';

    const dom = {};
    for (const [key, selector] of Object.entries(selectors)) {
      dom[key] = document.querySelector(selector);
    }

    // Core Functions
    const triggerSuggestion = (event) => {
      const content = event.textContent;
      if (content) sendMessage(content);

      // Removing Suggestion After Clicking
      if (event.tagName === 'SPAN' && event.classList.contains('suggestion')) {
        const id = event.getAttribute('data-id');
        event.remove();
        if (id) {
          const elements = document.querySelectorAll(`[data-id="${id}"]`);
          elements.forEach((item) => {
            item.remove();
          });
        }
      }
    };

    const deIndent = (markdownText) =>
      markdownText
        .split('\n')
        .map((line) => line.replace(/^\s{4,}/, ''))
        .join('\n')
        .trim();

    const openWidget = () => {
      dom.togglerBtn?.classList.add('hidden');
      dom.chatBotWidget?.classList.add('active');
      dom.bottomSuggestionList?.classList.remove('active');

      dom.bottomSuggestionList.innerHTML = `
        <span class="suggestion" data-id="suggestion-1" onclick="triggerSuggestion(this)">What's the main takeaway?</span>
        <span class="suggestion" data-id="suggestion-2" onclick="triggerSuggestion(this)">Is this relevant to IT managers?</span>
        <span class="suggestion" data-id="suggestion-3" onclick="triggerSuggestion(this)">Can you email me a summary 📩</span>
        `;
    };

    const closeWidget = () => {
      dom.togglerBtn?.classList.remove('hidden');
      dom.chatBotWidget?.classList.remove('active');
      dom.bottomSuggestionList?.classList.remove('active');
      revokeSessionId();
      revokeSessionTimer();
      resetSuggestions();
      dom.chatInput.value = '';
    };

    const resetSuggestions = () => {
      if (!dom.mainContent) return;

      dom.mainContent.innerHTML = `
    <div class="suggestions">
      <span class="title">Start with a question:</span>
      <div class="suggestion-list">
        <span class="suggestion" data-id="suggestion-1" onclick="triggerSuggestion(this)">What's the main takeaway?</span>
        <span class="suggestion" data-id="suggestion-2" onclick="triggerSuggestion(this)">Is this relevant to IT managers?</span>
        <span class="suggestion" data-id="suggestion-3" onclick="triggerSuggestion(this)">Can you email me a summary 📩</span>
      </div>
    </div>
  `;
    };

    const sendMessage = (suggestion = '') => {
      const message = dom.chatInput.value || suggestion;
      if (!message) return;

      const existingSuggestion = dom.mainContent.querySelector('.suggestions');
      if (existingSuggestion) {
        existingSuggestion.remove();
      }

      mountMessage(message, 'user');
      dom.chatInput.value = '';
      addLoader();
      dom.bottomSuggestionList?.classList.add('active');

      const sessionId = getSessionId();
      const payload = sessionId ? { message, sessionId } : { message };

      apiRequestService('/scraper-api/chatWidget/chat', payload)
        .then((data) => {
          // Triggering Session Timer when user sent first Message
          if (!sessionId) {
            triggerSessionTimer();
          }

          mountMessage(data.message, 'assistant');
          if (data?.sessionId) saveSessionId(data.sessionId);
        })
        .catch((err) => mountMessage(err.message, 'error'))
        .finally(removeLoader);
    };

    const mountMessage = (message, role = 'user') => {
      const md = window.markdownit();
      const rendered = md.render(deIndent(message));

      const wrapper = document.createElement('div');
      wrapper.className = `message ${role === 'error' ? 'error' : role}`;
      wrapper.innerHTML = rendered;

      dom.mainContent.appendChild(wrapper);
      scrollToBottom(dom.mainContent);
    };

    const apiRequestService = async (url, data = {}, method = 'POST') => {
      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: method === 'GET' ? null : JSON.stringify(data),
        });

        if (!res.ok) {
          const errorData = await res.json();
          throw new Error(
            errorData?.error?.message || 'Error getting response',
          );
        }

        const result = await res.json();
        return result?.data || result;
      } catch (err) {
        throw err;
      }
    };

    // Utility Functions
    const addLoader = () => {
      if (!dom.mainContent.querySelector('.loader')) {
        const loader = document.createElement('span');
        loader.className = 'loader';
        dom.mainContent.appendChild(loader);
        scrollToBottom(dom.mainContent);
      }
    };

    const removeLoader = () => {
      dom.mainContent.querySelector('.loader')?.remove();
    };

    const getSessionId = () => localStorage.getItem('chatbot_session_id');
    const saveSessionId = (id) =>
      localStorage.setItem('chatbot_session_id', id);
    const revokeSessionId = () => localStorage.removeItem('chatbot_session_id');

    const scrollToBottom = (el) => {
      el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
    };

    const triggerSessionTimer = () => {
      revokeSessionTimer();
      const timerId = setTimeout(
        triggerSessionClosing,
        SESSION_CLOSING_THRESHOLD,
      );
      window.localStorage.setItem(SESSION_TIMER_KEY, timerId);
      //
    };

    const revokeSessionTimer = () => {
      const timerId = window.localStorage.getItem(SESSION_TIMER_KEY);
      if (timerId) {
        clearTimeout(timerId);
        window.localStorage.removeItem(SESSION_TIMER_KEY);
      }
    };

    const triggerSessionClosing = () => {
      const sessionId = getSessionId();

      if (!sessionId) {
        console.log('No Session ID Found!');
        return;
      }
      const payload = {};

      apiRequestService(
        `/scraper-api/chatWidget/trigger-session-closing/${sessionId}`,
        payload,
      )
        .then((data) => {
          mountMessage(data.message, 'assistant');
          if (data?.sessionId) saveSessionId(data.sessionId);
        })
        .catch((err) => mountMessage(err.message, 'error'))
        .finally(removeLoader);
    };

    // Event Listeners
    dom.closeBtn?.addEventListener('click', closeWidget);
    dom.togglerBtn?.addEventListener('click', openWidget);
    dom.sendBtn?.addEventListener('click', sendMessage);

    dom.chatInput?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      revokeSessionId();
      revokeSessionTimer();
    });
  </script>
</html>
